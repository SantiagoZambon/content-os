{% extends "base.html" %}

{% block content %}
<main class="content-os-main" style="display:flex; align-items:center; justify-content:center; min-height:85vh;">
    <div class="content-os-container" style="max-width: 480px;">
        <div class="content-os-block app-fade-in" style="padding: 2.5rem 2rem;">
            <div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:1rem; margin-bottom:2rem;">
                <div class="signature-halo-wrapper">
                    <div class="signature-halo-glow"></div>
                    <div class="signature-halo-ring"></div>
                    <div class="signature-halo-content" style="width: 48px; height: 48px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <h2 class="content-os-title" style="font-size:1.6rem;">Content OS</h2>
                    <p style="color:#9c9c9a; font-size:0.875rem; margin-top:0.35rem;">Acceso administrativo al servidor</p>
                </div>
            </div>

            {% if error %}
            <div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; padding:0.75rem 1rem; border-radius:0.75rem; font-size:0.875rem; margin-bottom:1.5rem; text-align:center;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/auth" method="POST" style="display:flex; flex-direction:column; gap:1.25rem;">
                <div class="form-field">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="content-os-input" placeholder="Nombre de usuario" required autofocus>
                </div>

                <div class="form-field">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="content-os-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="content-os-btn content-os-btn-primary" style="margin-top:0.5rem; padding:0.75rem;">
                    Iniciar sesión
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
