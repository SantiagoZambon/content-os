[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "content-os"
version = "0.1.0"
description = "Calendario de contenidos web con persistencia local"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "libsass>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
